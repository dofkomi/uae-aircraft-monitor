name: UAE Aircraft Report

# بديل مجاني تماماً (بلا بطاقة ائتمان): تقرير كل ساعة عبر GitHub Actions.
# أضف TELEGRAM_BOT_TOKEN و TELEGRAM_CHAT_IDS في Settings > Secrets and variables > Actions
# اختياري (دراسة الذكاء الاصطناعي المجانية): GEMINI_API_KEY أو GROQ_API_KEY أو OPENROUTER_API_KEY
on:
  schedule:
    # موعدان في الساعة: GitHub يؤجّل بشدة الطلبات المجدولة عند رأس الساعة
    # (ملايين المستودعات تطلبها في اللحظة نفسها)، وقد يُهمل أحد الموعدين.
    # الدقيقة 37 احتياطية، وmain.py يتخطّى الإرسال إن أُرسل تقرير قبل 40 دقيقة.
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'إرسال فوري حتى لو أُرسل تقرير قبل أقل من 40 دقيقة (لتجربة يدوية)'
        type: boolean
        default: false
      source:
        description: 'من استدعى التشغيل؟ (يُطبع في السجل — اتركه فارغاً للاستدعاء اليدوي)'
        type: string
        default: ''

permissions:
  contents: write

# منع تشغيل نسختين متزامنتين (تقارير مكرّرة + تعارض على ذاكرة التخزين المؤقت)
concurrency:
  group: uae-aircraft-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # الحفاظ على قاعدة البيانات وعلامة آخر إرسال بين التشغيلات
      - uses: actions/cache@v4
        with:
          path: |
            data/aircraft.db
            data/last-send.txt
            data/last-daily.txt
          key: uae-monitor-db-${{ github.run_id }}
          restore-keys: uae-monitor-db-

      - run: pip install -r requirements.txt

      - name: جلب البيانات وإرسال التقرير
        env:
          # secrets.X || vars.X: يعمل سواء أُضيفت كـ Secret أو كـ Variable
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS || vars.TELEGRAM_CHAT_IDS }}
          USE_GEOCODING: '1'
          USE_WATCHLIST: '1'
          OSINT_ENABLED: '1'
          AI_ENABLED: '1'
          AI_REPORT_MODE: 'both'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || vars.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || vars.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          echo "trigger: ${{ github.event_name }} · source: ${{ inputs.source }}"
          python main.py --send-once ${{ inputs.force && '--force-send' || '' }} 2>&1 | tee data/last-run.log

      # عند الفشل نكتب سجلاً مختصراً ونرفعه إلى المستودع، لأن سجلات Actions
      # تحتاج تسجيل دخول. الملف يظهر في data/last-failure.md بعد أي فشل.
      - name: حفظ سبب الفشل في المستودع
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS || vars.TELEGRAM_CHAT_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
        run: |
          mkdir -p data
          {
            echo "# آخر فشل: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| المتغير | موجود؟ |"
            echo "|---|---|"
            echo "| TELEGRAM_BOT_TOKEN | $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo نعم || echo **لا**) |"
            echo "| TELEGRAM_CHAT_IDS | $([ -n "$TELEGRAM_CHAT_IDS" ] && echo نعم || echo **لا**) |"
            echo "| GEMINI_API_KEY | $([ -n "$GEMINI_API_KEY" ] && echo نعم || echo **لا**) |"
            echo
            echo '```'
            tail -n 150 data/last-run.log 2>/dev/null || echo "لا يوجد سجل"
            echo '```'
          } > data/last-failure.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/last-failure.md
          git commit -m "ci: record last failure [skip ci]" || exit 0
          git push || true

      # GitHub يعطّل الجدولة بعد 60 يوماً من عدم النشاط؛ نحدّث ملفاً مرة كل ~30 يوماً.
      - name: إبقاء الجدولة نشطة
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct -- .github/heartbeat.txt 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            date -u > .github/heartbeat.txt
            git add .github/heartbeat.txt
            git commit -m "chore: keep scheduled workflow active"
            git push
          fi
